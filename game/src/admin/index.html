<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sol2Earn.fun - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3a 100%);
            color: #fff;
            min-height: 100vh;
        }

        /* Login Page */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }

        .login-box h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
            background: linear-gradient(135deg, #00ff88, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-box .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #00ff88;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00ff88, #00d4ff);
            border: none;
            border-radius: 10px;
            color: #0a0a1a;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.3);
        }

        .error-message {
            background: rgba(255, 68, 68, 0.2);
            border: 1px solid rgba(255, 68, 68, 0.5);
            color: #ff6b6b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        /* Dashboard */
        .dashboard {
            display: none;
            padding: 20px;
        }

        .dashboard.active {
            display: block;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 24px;
            background: linear-gradient(135deg, #00ff88, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge.super-admin {
            background: linear-gradient(135deg, #ff6b6b, #ffa500);
            color: #fff;
        }

        .badge.admin {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
        }

        .btn-logout {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-logout:hover {
            background: rgba(255, 68, 68, 0.2);
            border-color: #ff6b6b;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            padding: 0 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 255, 136, 0.3);
        }

        .stat-card .label {
            color: #888;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .stat-card .value {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #00ff88, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Main Content */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 0 30px;
        }

        @media (max-width: 1200px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            overflow: hidden;
        }

        .panel-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-header h2 {
            font-size: 18px;
            font-weight: 600;
        }

        .panel-body {
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
        }

        /* Players Table */
        .players-table {
            width: 100%;
            border-collapse: collapse;
        }

        .players-table th,
        .players-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .players-table th {
            color: #888;
            font-weight: 500;
            font-size: 12px;
            text-transform: uppercase;
        }

        .players-table tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .btn-kick {
            padding: 6px 12px;
            background: rgba(255, 68, 68, 0.2);
            border: 1px solid rgba(255, 68, 68, 0.5);
            border-radius: 6px;
            color: #ff6b6b;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .btn-kick:hover {
            background: #ff6b6b;
            color: #fff;
        }

        .btn-spectate {
            padding: 6px 12px;
            background: rgba(0, 212, 255, 0.2);
            border: 1px solid rgba(0, 212, 255, 0.5);
            border-radius: 6px;
            color: #00d4ff;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
            margin-right: 5px;
        }

        .btn-spectate:hover {
            background: #00d4ff;
            color: #0a0a1a;
        }

        /* Chat Messages */
        .chat-message {
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .chat-message .meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 12px;
        }

        .chat-message .sender {
            color: #00ff88;
            font-weight: 500;
        }

        .chat-message .time {
            color: #666;
        }

        .chat-message .text {
            color: #ccc;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .no-data {
            color: #666;
            text-align: center;
            padding: 40px;
        }

        .refresh-btn {
            padding: 8px 16px;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 6px;
            color: #00ff88;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .refresh-btn:hover {
            background: rgba(0, 255, 136, 0.2);
        }

        /* Config Panel */
        .config-section {
            padding: 0 30px;
            margin-bottom: 30px;
        }

        .config-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            padding: 20px;
        }

        .config-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .config-item label {
            color: #aaa;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
        }

        .config-item label .config-range {
            font-size: 11px;
            color: #666;
        }

        .config-item input {
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
        }

        .config-item input:focus {
            outline: none;
            border-color: #00ff88;
        }

        .config-item input.changed {
            border-color: #ffa500;
        }

        .config-actions {
            display: flex;
            gap: 10px;
            padding: 15px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-save {
            padding: 10px 24px;
            background: linear-gradient(135deg, #00ff88, #00d4ff);
            border: none;
            border-radius: 8px;
            color: #0a0a1a;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 255, 136, 0.3);
        }

        .btn-save:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .config-status {
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            align-self: center;
        }

        .config-status.success {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
        }

        .config-status.error {
            background: rgba(255, 68, 68, 0.2);
            color: #ff6b6b;
        }
    </style>
</head>
<body>
    <!-- Login Page -->
    <div class="login-container" id="loginPage">
        <div class="login-box">
            <h1>🎮 Admin Panel</h1>
            <p class="subtitle">Agar.io Clone Management</p>
            <div class="error-message" id="loginError"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter admin password" required>
                </div>
                <button type="submit" class="btn">Login</button>
            </form>
        </div>
    </div>

    <!-- Dashboard -->
    <div class="dashboard" id="dashboard">
        <div class="header">
            <h1>🎮 Agar.io Admin Panel</h1>
            <div class="header-actions">
                <span class="badge" id="roleBadge">Admin</span>
                <button class="btn-logout" id="logoutBtn">Logout</button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="label">Active Players</div>
                <div class="value" id="statPlayers">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Total Mass</div>
                <div class="value" id="statMass">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Food Particles</div>
                <div class="value" id="statFood">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Viruses</div>
                <div class="value" id="statViruses">0</div>
            </div>
        </div>

        <div class="main-content">
            <!-- Config Panel (Super Admin only) -->
            <div class="panel config-section" id="configPanel" style="display:none; grid-column: 1 / -1;">
                <div class="panel-header">
                    <h2>⚙️ Game Configuration (Hot-Config)</h2>
                    <button class="refresh-btn" onclick="loadConfig()">Refresh</button>
                </div>
                <div class="config-grid" id="configGrid">
                    <div class="no-data">Loading config...</div>
                </div>
                <div class="config-actions">
                    <button class="btn-save" id="saveConfigBtn" disabled onclick="saveConfig()">💾 Save Changes</button>
                    <span class="config-status" id="configStatus"></span>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <h2>👥 Active Players</h2>
                    <button class="refresh-btn" onclick="loadPlayers()">Refresh</button>
                </div>
                <div class="panel-body">
                    <table class="players-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Mass</th>
                                <th>SOL</th>
                                <th>Cells</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="playersTable">
                            <tr><td colspan="5" class="no-data">No players online</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <h2>💬 Chat Log</h2>
                    <button class="refresh-btn" onclick="loadChat()">Refresh</button>
                </div>
                <div class="panel-body" id="chatLog">
                    <div class="no-data">No chat messages</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let sessionId = localStorage.getItem('adminSessionId');
        let isSuperAdmin = localStorage.getItem('isSuperAdmin') === 'true';

        // Check existing session
        if (sessionId) {
            showDashboard();
            loadStats();
            loadPlayers();
            loadChat();
            if (isSuperAdmin) loadConfig();
        }

        // Login form handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    sessionId = data.sessionId;
                    isSuperAdmin = data.isSuperAdmin;
                    localStorage.setItem('adminSessionId', sessionId);
                    localStorage.setItem('isSuperAdmin', isSuperAdmin);
                    showDashboard();
                    loadStats();
                    loadPlayers();
                    loadChat();
                    if (isSuperAdmin) loadConfig();
                } else {
                    showError(data.error || 'Invalid password');
                }
            } catch (err) {
                showError('Connection failed');
            }
        });

        // Logout handler
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await fetch('/api/logout', {
                method: 'POST',
                headers: { 'X-Session-Id': sessionId }
            });
            localStorage.removeItem('adminSessionId');
            localStorage.removeItem('isSuperAdmin');
            sessionId = null;
            location.reload();
        });

        function showError(message) {
            const errorEl = document.getElementById('loginError');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
        }

        function showDashboard() {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('dashboard').classList.add('active');
            
            const badge = document.getElementById('roleBadge');
            if (isSuperAdmin) {
                badge.textContent = 'Super Admin';
                badge.className = 'badge super-admin';
                document.getElementById('configPanel').style.display = 'block';
            } else {
                badge.textContent = 'Admin';
                badge.className = 'badge admin';
            }
        }

        async function apiCall(endpoint) {
            const res = await fetch(endpoint, {
                headers: { 'X-Session-Id': sessionId }
            });
            if (res.status === 401) {
                localStorage.removeItem('adminSessionId');
                location.reload();
                return null;
            }
            return res.json();
        }

        async function loadStats() {
            const stats = await apiCall('/api/stats');
            if (stats) {
                document.getElementById('statPlayers').textContent = stats.playerCount;
                document.getElementById('statMass').textContent = Math.round(stats.totalMass).toLocaleString();
                document.getElementById('statFood').textContent = stats.foodCount.toLocaleString();
                document.getElementById('statViruses').textContent = stats.virusCount;
            }
        }

        async function loadPlayers() {
            const players = await apiCall('/api/players');
            const tbody = document.getElementById('playersTable');
            
            if (!players || players.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="no-data">No players online</td></tr>';
                return;
            }

            tbody.innerHTML = players.map(p => `
                <tr>
                    <td>${escapeHtml(p.name)}${p.isCashingOut ? ' 💰' : ''}</td>
                    <td>${p.mass.toLocaleString()}</td>
                    <td>${p.solBalance > 0 ? '◎ ' + p.solBalance.toFixed(4) : '-'}</td>
                    <td>${p.cells}</td>
                    <td>
                        ${isSuperAdmin ? `<button class="btn-spectate" onclick="spectatePlayer('${p.id}')">👁️</button>` : ''}
                        <button class="btn-kick" onclick="kickPlayer('${p.id}', '${escapeHtml(p.name)}')">Kick</button>
                    </td>
                </tr>
            `).join('');
        }

        async function loadChat() {
            const messages = await apiCall('/api/chat');
            const chatLog = document.getElementById('chatLog');
            
            if (!messages || messages.length === 0) {
                chatLog.innerHTML = '<div class="no-data">No chat messages</div>';
                return;
            }

            chatLog.innerHTML = messages.slice(-50).reverse().map(m => `
                <div class="chat-message">
                    <div class="meta">
                        <span class="sender">${escapeHtml(m.sender)}</span>
                        <span class="time">${new Date(m.timestamp).toLocaleTimeString()}</span>
                    </div>
                    <div class="text">${escapeHtml(m.message)}</div>
                </div>
            `).join('');
        }

        async function kickPlayer(playerId, playerName) {
            const reason = prompt(`Kick ${playerName}? Enter reason:`, 'Kicked by admin');
            if (reason === null) return;

            await fetch(`/api/kick/${playerId}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Session-Id': sessionId
                },
                body: JSON.stringify({ reason })
            });
            
            loadPlayers();
            loadStats();
        }

        async function spectatePlayer(playerId) {
            const res = await fetch(`/api/spectate/${playerId}`, {
                method: 'POST',
                headers: { 'X-Session-Id': sessionId }
            });
            const data = await res.json();
            alert(`Spectate token: ${data.token}\n\nUse this to spectate the player.`);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ========== Config Management ==========
        let configOriginalValues = {};

        async function loadConfig() {
            if (!isSuperAdmin) return;
            const config = await apiCall('/api/config');
            if (!config) return;

            const grid = document.getElementById('configGrid');
            configOriginalValues = {};
            let html = '';

            for (const [key, info] of Object.entries(config)) {
                configOriginalValues[key] = info.value;
                const inputType = info.type === 'number' ? 'number' : 'text';
                const rangeText = (info.min !== undefined && info.max !== undefined) 
                    ? `<span class="config-range">${info.min} – ${info.max}</span>` : '';

                html += `<div class="config-item">
                    <label>${key} ${rangeText}</label>
                    <input type="${inputType}" id="cfg_${key}" value="${info.value}" 
                        ${info.min !== undefined ? 'min="' + info.min + '"' : ''}
                        ${info.max !== undefined ? 'max="' + info.max + '"' : ''}
                        ${info.type === 'number' ? 'step="any"' : ''}
                        onchange="markConfigChanged(this, '${key}')"
                        oninput="markConfigChanged(this, '${key}')" />
                </div>`;
            }
            grid.innerHTML = html;
            document.getElementById('saveConfigBtn').disabled = true;
            setConfigStatus('');
        }

        function markConfigChanged(input, key) {
            const original = configOriginalValues[key];
            const current = input.type === 'number' ? parseFloat(input.value) : input.value;
            
            if (current !== original) {
                input.classList.add('changed');
            } else {
                input.classList.remove('changed');
            }

            // Enable save if any value changed
            const anyChanged = document.querySelectorAll('.config-item input.changed').length > 0;
            document.getElementById('saveConfigBtn').disabled = !anyChanged;
        }

        async function saveConfig() {
            const changedInputs = document.querySelectorAll('.config-item input.changed');
            if (changedInputs.length === 0) return;

            const changes = {};
            changedInputs.forEach(input => {
                const key = input.id.replace('cfg_', '');
                changes[key] = input.type === 'number' ? parseFloat(input.value) : input.value;
            });

            try {
                const res = await fetch('/api/config', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Session-Id': sessionId,
                    },
                    body: JSON.stringify(changes),
                });
                const results = await res.json();

                let allOk = true;
                for (const [key, result] of Object.entries(results)) {
                    if (result.success) {
                        const val = result.newValue !== undefined ? result.newValue : result.value;
                        configOriginalValues[key] = val;
                        const input = document.getElementById('cfg_' + key);
                        if (input) {
                            input.value = val;
                            input.classList.remove('changed');
                        }
                    } else {
                        allOk = false;
                    }
                }

                if (allOk) {
                    setConfigStatus('✅ Config saved (applied immediately)', 'success');
                } else {
                    setConfigStatus('⚠️ Some settings failed', 'error');
                }
                document.getElementById('saveConfigBtn').disabled = true;
            } catch (err) {
                setConfigStatus('❌ Save failed', 'error');
            }
        }

        function setConfigStatus(msg, type) {
            const el = document.getElementById('configStatus');
            el.textContent = msg;
            el.className = 'config-status' + (type ? ' ' + type : '');
            if (msg) {
                setTimeout(() => { el.textContent = ''; el.className = 'config-status'; }, 5000);
            }
        }

        // Auto refresh every 5 seconds
        setInterval(() => {
            if (sessionId) {
                loadStats();
                loadPlayers();
            }
        }, 5000);

        // Refresh chat every 3 seconds
        setInterval(() => {
            if (sessionId) {
                loadChat();
            }
        }, 3000);
    </script>
</body>
</html>
